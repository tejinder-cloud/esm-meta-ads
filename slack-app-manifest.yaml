# Slack app manifest for the ESM Overseas Meta Ads runtime.
# Matches runtime/index.ts: Socket Mode on; replies in #esm-meta-ads via
# chat.postMessage (say). Handles both plain channel messages (message.channels
# + channels:history) and @mentions (app_mention + app_mentions:read).
# Create/update the app at https://api.slack.com/apps → "From a manifest".
# Note: changing scopes requires reinstalling the app to the workspace.
display_information:
  name: ESM Meta Ads
  description: 10-agent Meta Ads automation for ESM Overseas (manager agent in #esm-meta-ads).
  background_color: "#1264a3"
features:
  bot_user:
    display_name: ESM Meta Ads
    always_online: true
oauth_config:
  scopes:
    bot:
      # Read messages posted in channels the bot is in (for plain messages).
      - channels:history
      # Receive @mentions of the bot.
      - app_mentions:read
      # Post replies (say / chat.postMessage), including threaded replies.
      - chat:write
settings:
  event_subscriptions:
    # No request_url needed — events are delivered over Socket Mode.
    bot_events:
      - message.channels
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
